# Production stack for api.ayudagente.help. Host network throughout: this node's daemon runs
# with `iptables: false`, so a bridge container has no NAT. Isolation is the 127.0.0.1 binds.

name: ayudagente

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      network: host
    image: ayudagente-postgis-pgvector:16
    network_mode: host
    command: ["-c", "listen_addresses=127.0.0.1", "-p", "${DB_PORT:-5433}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5433} -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6380}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p ${REDIS_PORT:-6380} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/django.Dockerfile
      network: host
    image: ayudagente-web:latest
    network_mode: host
    env_file: ${ENV_FILE:-/opt/ayudagente/.env}
    volumes:
      - /opt/ayudagente/staticfiles:/app/staticfiles
      - /opt/ayudagente/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in: these spend OpenAI and Apify credit from the moment they start
  worker:
    image: ayudagente-web:latest
    network_mode: host
    profiles: ["workers"]
    # Celery forks one process per core, and this node has 112 against 100 db connections
    command:
      ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "celery",
       "-c", "${CELERY_CONCURRENCY:-8}"]
    env_file: ${ENV_FILE:-/opt/ayudagente/.env}
    volumes:
      - /opt/ayudagente/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Its own pool, because an Apify run holds a slot for half a minute and reading needs seconds
  harvest-worker:
    image: ayudagente-web:latest
    network_mode: host
    profiles: ["workers"]
    command:
      ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "harvest",
       "-n", "harvest@%h", "-c", "${HARVEST_CONCURRENCY:-6}"]
    env_file: ${ENV_FILE:-/opt/ayudagente/.env}
    volumes:
      - /opt/ayudagente/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: ayudagente-web:latest
    network_mode: host
    profiles: ["workers"]
    command: ["celery", "-A", "backend", "beat", "-l", "info"]
    env_file: ${ENV_FILE:-/opt/ayudagente/.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
