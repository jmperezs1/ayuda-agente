services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: hackaton-postgis-pgvector:16
    environment:
      POSTGRES_DB: ${DB_NAME:-hackaton}
      POSTGRES_USER: ${DB_USER:-hackaton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackaton}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hackaton} -d ${DB_NAME:-hackaton}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
