# api.ayudagente.help — the only public listener on this host.
#
# Note:
#   Certbot's nginx plugin rewrites this file in place to add the TLS block and the 80->443
#   redirect, so edit the proxy rules here and re-run certbot, not the other way round.

upstream ayudagente_api {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ayudagente.help;

    # Files on disk with DEBUG off; Django never sees these
    location /static/ {
        alias /opt/ayudagente/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/ayudagente/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://ayudagente_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The agent endpoints wait on model calls, past the 60s default
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    client_max_body_size 25m;
}
